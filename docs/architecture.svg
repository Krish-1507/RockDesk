<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F0644E"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect x="16" y="88" width="208" height="168" rx="12" fill="#FBFAF7" stroke="#D8D3C9" stroke-width="1.5"/>
  <text x="36" y="116" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#77736A">BROWSER</text>
  <text x="36" y="140" font-size="15" font-weight="700" fill="#151512">Next.js web app</text>
  <text x="36" y="166" font-size="13" fill="#4E4C46">Chat UI · public</text>
  <text x="36" y="190" font-size="13" fill="#4E4C46">Admin UI · login</text>
  <text x="36" y="214" font-size="13" fill="#4E4C46">Same-origin API proxy</text>
  <text x="36" y="238" font-size="12" fill="#77736A">rockdesk-iota</text>

  <!-- API -->
  <rect x="316" y="48" width="208" height="248" rx="12" fill="#151512"/>
  <text x="336" y="76" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#BDB7AC">SERVER</text>
  <text x="336" y="100" font-size="15" font-weight="700" fill="#FBFAF7">Express API</text>
  <text x="336" y="126" font-size="13" fill="#D8D3C9">Chat + stream routes</text>
  <text x="336" y="150" font-size="13" fill="#D8D3C9">Ticket + user routes</text>
  <text x="336" y="174" font-size="13" fill="#D8D3C9">Validated AI pipeline</text>
  <text x="336" y="198" font-size="13" fill="#D8D3C9">Idempotent sends</text>
  <text x="336" y="222" font-size="13" fill="#D8D3C9">Duplicate check</text>
  <text x="336" y="262" font-size="12" fill="#77736A">rockdesk-api</text>

  <!-- Supabase -->
  <rect x="616" y="88" width="208" height="76" rx="12" fill="#FBFAF7" stroke="#D8D3C9" stroke-width="1.5"/>
  <text x="636" y="116" font-size="15" font-weight="700" fill="#151512">Supabase</text>
  <text x="636" y="140" font-size="13" fill="#4E4C46">Postgres · Auth · RLS</text>

  <!-- Groq -->
  <rect x="616" y="180" width="208" height="76" rx="12" fill="#FBFAF7" stroke="#D8D3C9" stroke-width="1.5"/>
  <text x="636" y="208" font-size="15" font-weight="700" fill="#151512">Groq LLM</text>
  <text x="636" y="232" font-size="13" fill="#4E4C46">JSON mode · fallback key</text>

  <!-- Arrows -->
  <line x1="224" y1="172" x2="308" y2="172" stroke="#F0644E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="238" y="160" font-family="ui-monospace, monospace" font-size="11" fill="#4E4C46">HTTPS · token + JWT</text>

  <line x1="524" y1="126" x2="608" y2="126" stroke="#F0644E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="532" y="114" font-family="ui-monospace, monospace" font-size="11" fill="#4E4C46">SQL</text>

  <line x1="524" y1="218" x2="608" y2="218" stroke="#F0644E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="532" y="206" font-family="ui-monospace, monospace" font-size="11" fill="#4E4C46">prompt / JSON</text>
</svg>
